---
kind: pipeline
type: exec
name: default
platform:
  os: linux
  arch: amd64
steps:
  - name: Install Flutter
    commands:
      - wget --no-verbose https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.22.2-stable.tar.xz
      - tar -xf ./flutter_linux_3.22.2-stable.tar.xz -C ./
      - ./flutter/bin/flutter pub get
      - ./flutter/bin/flutter --version
  - name: Build application
    commands:
      - ./flutter/bin/flutter --version
      - ./flutter/bin/flutter build web --release --web-renderer=html
  - name: Deploy production environment
    commands:
      - echo "$SSH_PRIVATE_KEY" | tee ./ssh_private_key > /dev/null
      - chmod 600 ./ssh_private_key
      - rsync --archive --delete --rsh="ssh -i ./ssh_private_key" ./build/web/ $SSH_USER@$SSH_HOSTNAME:~/data
      - ssh -i ./ssh_private_key $SSH_USER@$SSH_HOSTNAME "find ~/data -type d -exec chmod 755 {} \;"
      - ssh -i ./ssh_private_key $SSH_USER@$SSH_HOSTNAME "find ~/data -type f -exec chmod 644 {} \;"
      - rm ./ssh_private_key
    when:
      branch:
        - master
    environment:
      SSH_USER:
        from_secret: SSH_USER
      SSH_HOSTNAME:
        from_secret: SSH_HOSTNAME
      SSH_PRIVATE_KEY:
        from_secret: SSH_PRIVATE_KEY
